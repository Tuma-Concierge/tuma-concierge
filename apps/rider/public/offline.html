<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tuma Driver — Offline</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F7F3EE;
    color: #0A0A0A;
    text-align: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0D203D; color: #F7F3EE; }
  }
  h1 { font-size: 19px; margin: 0; }
  p { font-size: 14px; color: #5C6670; margin: 0; max-width: 280px; line-height: 1.5; }
  button {
    margin-top: 6px;
    min-height: 44px;
    padding: 0 26px;
    border-radius: 999px;
    border: none;
    background: #C9A227;
    color: #0A0A0A;
    font-weight: 700;
    font-size: 15px;
  }
</style>
</head>
<body>
  <h1>You're offline</h1>
  <p>Tuma Driver needs a connection to load this. Your jobs, chat, and wallet are still there from the last time you had signal.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
