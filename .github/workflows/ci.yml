name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The legacy Worker scaffold (workers/api): install + typecheck only.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install worker deps
        working-directory: workers/api
        run: npm install
      - name: Typecheck
        working-directory: workers/api
        run: npx tsc --noEmit

  # The real code: typecheck every app and run the API tests.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck apps
        run: |
          set -e
          for app in api admin customer merchant partner restaurant rider web preview-hub; do
            echo "::group::tsc $app"
            (cd apps/$app && npx tsc --noEmit)
            echo "::endgroup::"
          done
      - name: API tests
        working-directory: apps/api
        run: pnpm lint && pnpm test

  # Every Next.js app must still build.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, customer, rider]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build
