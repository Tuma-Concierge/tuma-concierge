name: Deploy to Cloudflare

# Pushes to any non-main branch deploy changed Workers to Cloudflare PREVIEW.
# Pushes/merges to main deploy changed Workers to Cloudflare LIVE (production).
# Manual runs allow choosing specific apps and deployment target (live vs preview).
#
# Required repository secrets:
# - CLOUDFLARE_API_TOKEN (Permission: Edit Cloudflare Workers)
# - CLOUDFLARE_ACCOUNT_ID

on:
  push:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Space-separated apps to deploy (api admin customer merchant partner restaurant rider web preview-hub), or "all"'
        default: all
      target:
        description: 'Deployment target (auto, live, or preview)'
        default: auto
        type: choice
        options:
          - auto
          - live
          - preview

concurrency:
  group: cloudflare-${{ github.ref == 'refs/heads/main' && 'live' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
      target: ${{ steps.pick.outputs.target }}
      alias: ${{ steps.pick.outputs.alias }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        env:
          MANUAL_APPS: ${{ github.event.inputs.apps }}
          MANUAL_TARGET: ${{ github.event.inputs.target }}
        run: |
          # 1. Determine target (live vs preview)
          TARGET="$MANUAL_TARGET"
          if [ -z "$TARGET" ] || [ "$TARGET" = "auto" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              TARGET="live"
            else
              TARGET="preview"
            fi
          fi

          # 2. Compute preview alias from branch name
          # Sanitize: lowercase, alphanumeric and single hyphens, max 28 chars
          RAW_REF="${GITHUB_REF_NAME:-preview}"
          ALIAS=$(echo "$RAW_REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\{2,\}/-/g' | sed 's/^-//' | sed 's/-$//')
          ALIAS=$(echo "$ALIAS" | cut -c1-28 | sed 's/-$//')
          [ -z "$ALIAS" ] && ALIAS="preview"

          # 3. Detect changed apps
          ALL="api admin customer merchant partner restaurant rider web preview-hub"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MANUAL_APPS" ] && [ "$MANUAL_APPS" != "all" ]; then
            APPS="$MANUAL_APPS"
          else
            if [ "$TARGET" = "live" ]; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            else
              CHANGED=$(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            fi

            # Shared code, lockfile, workspace, scripts, or deploy workflow changes affect every app
            if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(packages/|pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|\.npmrc|scripts/|\.github/workflows/deploy\.yml)'; then
              APPS="$ALL"
            else
              APPS=""
              for a in $ALL; do
                if echo "$CHANGED" | grep -q "^apps/$a/"; then
                  APPS="$APPS $a"
                fi
              done
            fi
          fi

          JSON=$(printf '%s\n' $APPS | grep -v '^$' | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "Target: $TARGET"
          echo "Alias: $ALIAS"
          echo "Apps: $JSON"
          echo "apps=$JSON" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: ${{ needs.plan.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ needs.plan.outputs.target }}
      ALIAS: ${{ needs.plan.outputs.alias }}
      OPEN_NEXT_DEPLOY: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # On live deploy, checkout 'main' explicitly so preflight-deploy.mjs succeeds
          ref: ${{ needs.plan.outputs.target == 'live' && 'main' || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck before deploying
        if: ${{ matrix.app == 'api' || matrix.app == 'preview-hub' }}
        run: pnpm --filter ${{ matrix.app }} lint

      - name: Deploy ${{ matrix.app }} (LIVE)
        if: ${{ env.TARGET == 'live' }}
        working-directory: apps/${{ matrix.app }}
        run: |
          echo "🚀 Deploying ${{ matrix.app }} to Cloudflare LIVE..."
          pnpm run deploy
          echo "| ${{ matrix.app }} | 🟢 Live | Deployed to production |" >> $GITHUB_STEP_SUMMARY

      - name: Deploy ${{ matrix.app }} (PREVIEW)
        if: ${{ env.TARGET != 'live' }}
        working-directory: apps/${{ matrix.app }}
        run: |
          echo "🔍 Deploying ${{ matrix.app }} to Cloudflare PREVIEW (alias: $ALIAS)..."
          if [ "${{ matrix.app }}" = "customer" ] || [ "${{ matrix.app }}" = "rider" ] || [ "${{ matrix.app }}" = "admin" ]; then
            npx opennextjs-cloudflare build
          fi

          OUTPUT=$(npx wrangler versions upload --preview-alias "$ALIAS" --tag "$ALIAS" --message "Preview for $ALIAS ($GITHUB_SHA)" 2>&1 || \
                   npx wrangler versions upload --tag "$ALIAS" --message "Preview for $ALIAS ($GITHUB_SHA)" 2>&1)
          echo "$OUTPUT"

          PREVIEW_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n 1 || echo "https://${ALIAS}-tuma-${{ matrix.app }}.doxalight-inc.workers.dev")
          SHORT_SUBDOMAIN="https://${{ matrix.app }}-preview.tumaffe.online"
          SHORT_HUB_LINK="https://preview.tumaffe.online/${ALIAS}/${{ matrix.app }}"
          echo "Preview URL for ${{ matrix.app }}: $PREVIEW_URL"
          echo "Short Subdomain for ${{ matrix.app }}: $SHORT_SUBDOMAIN"
          echo "| ${{ matrix.app }} | 🔍 Preview ($ALIAS) | [$SHORT_SUBDOMAIN]($SHORT_SUBDOMAIN) · [Short Router]($SHORT_HUB_LINK) · [Worker URL]($PREVIEW_URL) |" >> $GITHUB_STEP_SUMMARY
